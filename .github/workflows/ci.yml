name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go test ./...
      - run: go vet ./...
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build:web
      - run: pnpm docs:build
      - run: docker build --target dopsy --tag dopsy:ci .
      - run: docker build --target dopsy-proxy --tag dopsy-proxy:ci .
