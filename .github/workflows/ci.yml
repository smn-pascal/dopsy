name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go test ./...
      - run: go vet ./...
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm build:web
      - run: pnpm docs:build
      - run: docker build --target dopsy --tag dopsy:ci .
      - run: docker build --target dopsy-proxy --tag dopsy-proxy:ci .
      - name: Validate image Compose overlay and security boundary
        run: |
          docker compose -f compose.yaml -f compose.images.yaml config --format json |
            node -e '
              const c=JSON.parse(require("fs").readFileSync(0,"utf8"));
              const app=c.services.dopsy, proxy=c.services["docker-proxy"];
              if(app.build || proxy.build || app.image!=="ghcr.io/smn-pascal/dopsy:v0.1.3" || proxy.image!=="ghcr.io/smn-pascal/dopsy-proxy:v0.1.3") process.exit(1);
              if(!app.ports?.length || app.ports.some(port=>port.host_ip!=="127.0.0.1")) process.exit(1);
              if(app.volumes?.some(volume=>volume.source==="/var/run/docker.sock")) process.exit(1);
              if(!proxy.volumes?.some(volume=>volume.source==="/var/run/docker.sock" && volume.read_only)) process.exit(1);
              if(!c.networks["docker-api"].internal || !app.read_only || !proxy.read_only) process.exit(1);
            '
      - name: Smoke test fresh Compose demo on Linux
        if: github.event_name != 'pull_request'
        env:
          DOPSY_DEMO_MODE: "true"
          DOPSY_PORT: "18080"
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          docker compose up --build --detach
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/api/health |
            node -e 'const value=JSON.parse(require("fs").readFileSync(0,"utf8")); if(value.status!=="ok" || !value.docker.connected || value.docker.mode!=="demo") process.exit(1)'
          curl --fail --silent --show-error http://127.0.0.1:18080/api/overview |
            node -e 'const value=JSON.parse(require("fs").readFileSync(0,"utf8")); if(value.summary.total<2 || !value.containers.some(item=>item.id==="demo-api" && item.details?.oomKilled)) process.exit(1)'
          curl --fail --silent --show-error --header 'Content-Type: application/json' --data '{"message":"Why did demo-api stop?","containerId":"demo-api"}' http://127.0.0.1:18080/api/chat |
            node -e 'const value=JSON.parse(require("fs").readFileSync(0,"utf8")); if(typeof value.answer!=="string" || !value.answer.trim() || !value.evidence?.some(item=>item.label==="Event history") || !value.steps?.some(item=>item.tool==="get_container_events")) process.exit(1)'
